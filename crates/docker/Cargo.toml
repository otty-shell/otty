[package]
name = "otty-docker"
homepage = "https://otty.run"
repository = "https://github.com/otty-shell/otty"
description = "Finds and talks to the local Docker or Podman engine"
authors = ["Ilya Shvyryalkin <ilyashvy@gmail.com>"]
version = "0.1.0"
license = "Apache-2.0"
edition = { workspace = true }
rust-version = { workspace = true }

[dependencies]
# Docker Engine API client; Podman serves the same API. Default features only
# (`http`, `pipe`): unix socket and plain tcp, no ssl, no ssh.
bollard = "0.21.1"
# Waits on all engine probes at once and, later, reads bollard's streams.
futures-util = "0.3.31"
log = { workspace = true }
# Pretty-prints the inspect answers, and reads the captured engine answers
# behind the `fixtures` feature. bollard already depends on it.
serde_json = { workspace = true }
thiserror = { workspace = true }
# `process` runs `docker --version` with a time limit (the `podman-docker`
# check) and `fs` asks whether a folder exists off the UI thread; the workspace
# already builds tokio, so no new crate.
tokio = { version = "1.47", features = ["fs", "net", "process", "time"] }

[features]
# `otty_docker::fixtures`: values mapped from the captured engine answers in
# `tests/fixtures`, for the tests of crates that use this one.
fixtures = []

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt", "sync"] }
