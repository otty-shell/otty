[package]
name = "otty-test-plugins"
description = "Small WebAssembly components that test the limits of otty-plugin-host"
readme = "README.md"
version = "0.1.0"
license = "Apache-2.0"
publish = false
edition = "2024"
rust-version = "1.96.0"

# Built on its own for `wasm32-wasip2` by `scripts/build-test-plugins.sh`;
# the OTTY workspace leaves it out.
[workspace]

[lib]
crate-type = ["cdylib"]

# Each build turns on exactly one feature: the plugin to build.
[features]
minimal = []
misbehave = []
read-files = []
programs = []

[dependencies]
otty-plugin-sdk = { path = "../../../sdk" }
wit-bindgen = { version = "0.57.1", default-features = false, features = ["macros", "realloc", "std"] }

# Small fixtures: their speed does not matter.
[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
strip = true
panic = "abort"
