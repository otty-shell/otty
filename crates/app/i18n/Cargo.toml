[package]
name = "otty-app-i18n"
homepage = "https://otty.run"
repository = "https://github.com/otty-shell/otty"
description = "Translations of the OTTY app: text keys, locales and the embedded catalogs"
authors = ["Ilya Shvyryalkin <ilyashvy@gmail.com>"]
version = "0.1.0"
license = "Apache-2.0"
edition = { workspace = true }
rust-version = { workspace = true }

# No iced, no I/O and no tokio: the features and the binary depend on this one.
# The system locale and the settings are read by the binary, not here.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
