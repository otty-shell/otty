[package]
name = "otty-app-agents-io"
homepage = "https://otty.run"
repository = "https://github.com/otty-shell/otty"
description = "I/O of the OTTY app Agents mode: agents.json, finding the agents' programs and reading their sessions, limits, tokens spent and list prices"
readme = "README.md"
authors = ["Ilya Shvyryalkin <ilyashvy@gmail.com>"]
version = "0.1.0"
license = "Apache-2.0"
edition = { workspace = true }
rust-version = { workspace = true }

# The I/O crate of Agents mode: it depends on its feature (for the Intent)
# and on what the I/O needs, never on another feature. `otty-agents` reads
# the profiles and the sessions, and `otty-app-shell` gives the arguments
# that run the user's login shell, which finds a program the way the agent
# tab starts it and gives the admin key variable, quotes the command that
# continues a session for the clipboard, and tells whether the shell can be
# run. Its own clippy.toml has no I/O bans. The reads are
# blocking, so they run on a thread of their own.
[dependencies]
iced = { workspace = true }
# Reads the user's time zone from the system: `tz-system` asks the `TZ`
# variable, /etc/localtime or Windows; `tzdb-zoneinfo` finds the zone in
# /usr/share/zoneinfo; `tzdb-bundle-platform` brings the zone database into
# the build on Windows only, which has no such folder.
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
log = { workspace = true }
otty-agents = { path = "../../../../agents", version = "0.1.0" }
otty-app-agents = { path = "../core", version = "0.1.0" }
otty-app-i18n = { path = "../../../i18n", version = "0.1.0" }
otty-app-shell = { path = "../../../shell", version = "0.1.0" }
# Runs an agent's program in a hidden pseudo-terminal and keeps its screen
# with OTTY's own terminal engine, for a source that reads the screen.
otty-libterm = { path = "../../../../libterm", version = "0.1.0" }
# The errors of reading and writing `agents.json`, with their text in the
# user's language.
thiserror = { workspace = true }

# Asks an agent's program to stop with `SIGTERM` before it is killed.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal"] }

# `fixtures` tells where the price source keeps its copy, in the test
# build only.
[dev-dependencies]
iced_test = "0.14"
otty-agents = { path = "../../../../agents", version = "0.1.0", features = ["fixtures"] }
otty-app-testing = { path = "../../../testing", version = "0.1.0" }
