[package]
name = "otty-app-agents"
homepage = "https://otty.run"
repository = "https://github.com/otty-shell/otty"
description = "Agents mode of the OTTY app: the profiles and projects of the coding agents, the sessions of a project and the status bar"
readme = "README.md"
authors = ["Ilya Shvyryalkin <ilyashvy@gmail.com>"]
version = "0.1.0"
license = "Apache-2.0"
edition = { workspace = true }
rust-version = { workspace = true }

# A feature crate: helper crates, otty-ui-* and libraries only. No other
# feature, no binary, no io crate and no tokio. The bans of
# crates/app/features/clippy.toml apply: otty-app-agents-io reads
# agents.json, finds the agents' programs and reads the sessions.
# `otty-agents` gives the data types and the command that starts an agent;
# the feature calls none of its reads.
[dependencies]
iced = { workspace = true, features = ["svg"] }
log = { workspace = true }
otty-agents = { path = "../../../../agents", version = "0.1.0" }
otty-app-domain = { path = "../../../domain", version = "0.1.0" }
otty-app-i18n = { path = "../../../i18n", version = "0.1.0" }
otty-app-slots = { path = "../../../slots", version = "0.1.0" }
otty-app-theme = { path = "../../../theme", version = "0.1.0" }
otty-ui-kit = { path = "../../../../ui/kit", version = "0.1.0" }

[dev-dependencies]
iced_test = "0.14"
