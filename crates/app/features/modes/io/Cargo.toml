[package]
name = "otty-app-modes-io"
homepage = "https://otty.run"
repository = "https://github.com/otty-shell/otty"
description = "I/O of the OTTY app modes: reading and writing the pinned modes file"
readme = "README.md"
authors = ["Ilya Shvyryalkin <ilyashvy@gmail.com>"]
version = "0.1.0"
license = "Apache-2.0"
edition = { workspace = true }
rust-version = { workspace = true }

# The I/O crate of the modes: it depends on its feature (for the Intent) and
# on what the I/O needs, never on another feature. Its own clippy.toml has
# no I/O bans. iced runs the writes on tokio, as in the app.
[dependencies]
iced = { workspace = true, features = ["tokio"] }
log = { workspace = true }
otty-app-domain = { path = "../../../domain", version = "0.1.0" }
otty-app-i18n = { path = "../../../i18n", version = "0.1.0" }
otty-app-modes = { path = "../core", version = "0.1.0" }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
otty-app-testing = { path = "../../../testing", version = "0.1.0" }
