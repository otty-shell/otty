[package]
name = "otty-app-quick-launch"
homepage = "https://otty.run"
repository = "https://github.com/otty-shell/otty"
description = "Quick launch of the OTTY app: the tree of saved launches, the launch editor and the SSH secret prompt"
authors = ["Ilya Shvyryalkin <ilyashvy@gmail.com>"]
version = "0.1.0"
license = "Apache-2.0"
edition = { workspace = true }
rust-version = { workspace = true }

# A feature crate: helper crates, otty-ui-* and libraries only. No other
# feature, no binary, no tokio and no notify. The bans of
# crates/app/features/clippy.toml apply: the binary reads and writes the
# launches file and checks a launch before it runs, in
# effects/quick_launch.rs. `otty-ui-term` gives the terminal settings a
# prepared launch hands to the tabs.
[dependencies]
iced = { workspace = true, features = ["svg"] }
log = { workspace = true }
otty-app-domain = { path = "../../domain", version = "0.1.0" }
otty-app-i18n = { path = "../../i18n", version = "0.1.0" }
otty-app-slots = { path = "../../slots", version = "0.1.0" }
otty-app-theme = { path = "../../theme", version = "0.1.0" }
otty-ui-kit = { path = "../../../ui/kit", version = "0.1.0" }
otty-ui-term = { path = "../../../ui/terminal", version = "0.1.0" }
otty-ui-tree = { path = "../../../ui/tree", version = "0.1.0" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
iced_test = "0.14"
otty-app-testing = { path = "../../testing", version = "0.1.0" }
serde_json = { workspace = true }
