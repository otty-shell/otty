# Rules of the I/O crate otty-app-containers-io.
# Clippy reads the nearest clippy.toml from the crate folder upwards, so this
# file replaces crates/app/features/clippy.toml: the thresholds are copied
# from the root file. The crate talks to the engines, checks folders and
# starts the browser, so it has no I/O bans.
too-many-arguments-threshold = 30
enum-variant-name-threshold = 10
type-complexity-threshold = 250
