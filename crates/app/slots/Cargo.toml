[package]
name = "otty-app-slots"
homepage = "https://otty.run"
repository = "https://github.com/otty-shell/otty"
description = "The socket every OTTY app feature plugs into: the Component trait, the place traits, overlays and the main area content"
authors = ["Ilya Shvyryalkin <ilyashvy@gmail.com>"]
version = "0.1.0"
license = "Apache-2.0"
edition = { workspace = true }
rust-version = { workspace = true }

[dependencies]
iced = { workspace = true }
otty-app-theme = { path = "../theme", version = "0.1.0" }
otty-ui-kit = { path = "../../ui/kit", version = "0.1.0" }
