[package]
name = "otty-ui-kit"
homepage = "https://otty.run"
repository = "https://github.com/otty-shell/otty"
description = "Design tokens for OTTY widgets"
authors = ["Ilya Shvyryalkin <ilyashvy@gmail.com>"]
version = "0.1.0"
license = "Apache-2.0"
readme = "./README.md"
edition = { workspace = true }
rust-version = { workspace = true }

[dependencies]
# Fuzzy matcher (MIT, no required dependencies) that ranks the suggestions of
# `TagSearch` and tolerates a typo. It picks a SIMD backend at run time and
# falls back to plain code, so it needs no target-specific setup.
frizbee = "0.13"
iced = { workspace = true, features = ["svg", "advanced"] }

[dev-dependencies]
iced_test = "0.14"
