[package]
name = "otty-agents"
homepage = "https://otty.run"
repository = "https://github.com/otty-shell/otty"
description = "What OTTY knows about coding agents such as Claude Code and Codex"
readme = "README.md"
authors = ["Ilya Shvyryalkin <ilyashvy@gmail.com>"]
version = "0.1.0"
license = "Apache-2.0"
edition = { workspace = true }
rust-version = { workspace = true }

[dependencies]
ruzstd = "0.9.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The HTTPS requests for the limits (spec Decision 8). TLS comes from
# rustls with ring and the Mozilla roots of webpki-roots: no OpenSSL and no
# aws-lc-rs. gzip and the other default features are left out.
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
mockall = { workspace = true }
