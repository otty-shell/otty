[advisories]
unsound = "workspace"
unmaintained = "workspace"
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "wayland-scanner 0.31.10 is the latest compatible release and still constrains quick-xml to ^0.39; remove once the iced Wayland stack can use quick-xml >=0.41" },
    { id = "RUSTSEC-2026-0195", reason = "wayland-scanner 0.31.10 is the latest compatible release and still constrains quick-xml to ^0.39; remove once the iced Wayland stack can use quick-xml >=0.41" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "NCSA",
    "CC0-1.0",
    "BSL-1.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    # webpki-roots (through ureq in otty-agents): the Mozilla root
    # certificates that rustls checks the servers against.
    "CDLA-Permissive-2.0",
    # wasmtime and Cranelift (through otty-plugin-host), which run and
    # compile the plugins: Apache 2.0 with an exception that only removes a
    # condition for compiled code.
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
    # A crate dependency limit of the app architecture (issue 21): only
    # Agents mode and the binary know the `agents` domain. The Plugins page
    # (otty-app-plugins and otty-app-plugins-io) calls the parts of any
    # domain through otty-plugin-host and must not depend on otty-agents.
    { crate = "otty-agents", wrappers = ["otty-app-agents", "otty-app-agents-io", "otty"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
