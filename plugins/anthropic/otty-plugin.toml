# The manifest of the official Anthropic plugin: the agent Claude Code and
# the provider Anthropic.
[plugin]
id = "anthropic"
name = "Anthropic"
version = "0.2.2"
description = "Claude Code profiles, sessions, tokens and logins; Claude limits, from Anthropic or the /usage panel of Claude Code; Anthropic organization bills."
repository = "https://github.com/otty-shell/otty-plugin-anthropic"
license = "Apache-2.0"
authors = ["OTTY team"]
wasm = "anthropic.wasm"

# One contract version per kind of part the .wasm exports, and the
# language receiver: the texts of the needs come in every language of
# OTTY.
[api]
agents.agent = "0.1"
agents.provider = "0.1"
language = "0.1"

[[agents.agent]]
id = "claude-code"
name = "Claude Code"
icon = "claude-code.svg"
program = "claude"
# The native installer of Claude Code puts the program here, a folder
# the login shell may not have on its PATH; OTTY then starts it by
# this path.
program_places = ["~/.local/bin/claude"]
tested_version = "2.1.328"

# Offered when OTTY finds the program nowhere: the setup page of
# Claude Code.
[agents.agent.install]
page = "https://docs.anthropic.com/en/docs/claude-code/setup"

# Apply only while a function of this part runs. `CLAUDE_CONFIG_DIR` moves
# the default config folder, so it comes first in `env`.
[agents.agent.permissions]
read = ["~/.claude*/**", "{CLAUDE_CONFIG_DIR}/**"]
env = ["CLAUDE_CONFIG_DIR"]

# Where the keys are: readable only with the keys replaced by handles.
# The Claude login.
[[agents.agent.permissions.keys]]
files = ["~/.claude*/.credentials.json", "{CLAUDE_CONFIG_DIR}/.credentials.json"]
fields = ["/claudeAiOauth/accessToken", "/claudeAiOauth/refreshToken"]

# The global config file: next to `~/.claude`, or inside the config folder
# of another profile.
[[agents.agent.permissions.keys]]
files = ["~/.claude.json", "~/.claude*/.claude.json", "{CLAUDE_CONFIG_DIR}/.claude.json"]
fields = ["/primaryApiKey"]

# The variables the settings give Claude Code.
[[agents.agent.permissions.keys]]
files = ["~/.claude*/settings.json", "{CLAUDE_CONFIG_DIR}/settings.json"]
fields = ["/env/ANTHROPIC_AUTH_TOKEN", "/env/ANTHROPIC_API_KEY"]

# The numbers of Anthropic accounts: the limits of a Claude login, read
# from Anthropic's usage request, else from the `/usage` panel of Claude
# Code in a profile the login was found in, and the bill of an
# organization read with an admin key added by hand. A key behind another
# server is for that server's host and is not read here.
[[agents.provider]]
id = "anthropic"
name = "Anthropic"
icon = "anthropic.svg"
hosts = ["anthropic.com", "claude.ai"]
usage_page = "https://console.anthropic.com/settings/usage"
plan_usage_page = "https://claude.ai/settings/usage"
add_by_hand = true

# Apply only while a function of this part runs: the files of the
# `claude-code` part are refused then.
#
# The `/usage` probe runs `claude` in OTTY's working folder of hidden
# terminals, `~/.cache/otty/agent-probe`, with the variables the
# `claude-code` part starts it with in the profile, and Claude Code writes
# a session file for the run in the project folder named after it,
# `projects/-home-<user>--cache-otty-agent-probe`. The probe lists and
# deletes those files, and the folder once it is empty; nothing else may
# be read or written. `DISABLE_AUTOUPDATER` is passed to that run only.
[agents.provider.permissions]
http = ["api.anthropic.com"]
read = [
  "~/.claude*/projects/*--cache-otty-agent-probe/*.jsonl",
  "{CLAUDE_CONFIG_DIR}/projects/*--cache-otty-agent-probe/*.jsonl",
]
write = [
  "~/.claude*/projects/*--cache-otty-agent-probe",
  "~/.claude*/projects/*--cache-otty-agent-probe/*.jsonl",
  "{CLAUDE_CONFIG_DIR}/projects/*--cache-otty-agent-probe",
  "{CLAUDE_CONFIG_DIR}/projects/*--cache-otty-agent-probe/*.jsonl",
]
env = ["CLAUDE_CONFIG_DIR", "DISABLE_AUTOUPDATER"]

# The `/usage` probe: `claude` that can run nothing, with no tools, no MCP
# servers of the user, no hooks and no remote control. Each argument is a
# glob, so the braces of the settings are escaped.
[[agents.provider.permissions.terminal]]
program = "claude"
args = [
  "--allowed-tools",
  "",
  "--strict-mcp-config",
  "--settings",
  '\{"remoteControlAtStartup":false,"disableAllHooks":true\}',
]
