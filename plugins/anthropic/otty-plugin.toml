# The manifest of the official Anthropic plugin: the agent Claude Code and
# the provider Anthropic.
[plugin]
id = "anthropic"
name = "Anthropic"
version = "0.2.18"
description = "Claude Code and Anthropic accounts in OTTY."
repository = "https://github.com/otty-shell/otty-plugin-anthropic"
license = "Apache-2.0"
authors = ["OTTY team"]
wasm = "anthropic.wasm"

[[agents.agent]]
id = "claude-code"
name = "Claude Code"
description = "Finds Claude Code profiles, sessions, tokens and their money."
icon = "claude-code.svg"
program = "claude"
# The native installer of Claude Code puts the program here, a folder
# the login shell may not have on its PATH; OTTY then starts it by
# this path.
program_places = ["~/.local/bin/claude"]
tested_version = "2.1.328"

# Offered when OTTY finds the program nowhere: the native installer of
# Claude Code, as its setup page gives it (it puts the program in
# `~/.local/bin`), and that page.
[agents.agent.install]
command = ["sh", "-c", "curl -fsSL https://claude.ai/install.sh | bash"]
page = "https://code.claude.com/docs/en/setup"

# Apply only while a function of this part runs. `CLAUDE_CONFIG_DIR` moves
# the default config folder, so it comes first in `env`.
[agents.agent.permissions]
read = ["~/.claude*/**", "{CLAUDE_CONFIG_DIR}/**"]
env = ["CLAUDE_CONFIG_DIR"]

# Where the keys are: readable only with the keys replaced by handles.
# The part reads them only to tell whether a profile is logged in; the
# provider part finds the accounts. The Claude login.
[[agents.agent.permissions.keys]]
files = ["~/.claude*/.credentials.json", "{CLAUDE_CONFIG_DIR}/.credentials.json"]
fields = ["/claudeAiOauth/accessToken", "/claudeAiOauth/refreshToken"]

# The global config file: next to `~/.claude`, or inside the config folder
# of another profile.
[[agents.agent.permissions.keys]]
files = ["~/.claude.json", "~/.claude*/.claude.json", "{CLAUDE_CONFIG_DIR}/.claude.json"]
fields = ["/primaryApiKey"]

# The variables the settings give Claude Code.
[[agents.agent.permissions.keys]]
files = ["~/.claude*/settings.json", "{CLAUDE_CONFIG_DIR}/settings.json"]
fields = ["/env/ANTHROPIC_AUTH_TOKEN", "/env/ANTHROPIC_API_KEY"]

# The accounts of Anthropic, found in the Claude Code profiles OTTY gives
# the part (see `logins` below): a Claude login, a Console key and an
# Anthropic key of the settings. A key behind another server, such as
# DeepSeek's, is no Anthropic account. Their numbers: the limits of a
# Claude login, read from Anthropic's usage request, else from the
# `/usage` panel of Claude Code in a profile the login was found in, and
# the bill of an organization read with its own admin key or the one the
# user gives for it. A key or an organization without a bill gets what
# the Claude Code sessions of its folders spent this month, at API prices.
[[agents.provider]]
id = "anthropic"
name = "Anthropic"
description = "Finds Claude and Anthropic accounts and reads their limits and organization bills."
icon = "anthropic.svg"
hosts = ["anthropic.com", "claude.ai"]
usage_page = "https://console.anthropic.com/settings/usage"
plan_usage_page = "https://claude.ai/settings/usage"

# Apply only while a function of this part runs: the files of the
# `claude-code` part are refused then, but for what `logins` below gives
# in the folders of a call.
#
# The `/usage` probe runs `claude` in OTTY's working folder of hidden
# terminals, `~/.cache/otty/agent-probe`, pointed at a folder the account
# was found in as the `claude-code` part starts it there, and Claude Code
# writes a session file for the run in the project folder named after
# it, `projects/-home-<user>--cache-otty-agent-probe`. The probe lists
# those files and deletes them, and the folder once it is empty, inside
# the folders of the call only (`read` and `write` of `logins`).
# `DISABLE_AUTOUPDATER` is passed to that run only. `CLAUDE_CONFIG_DIR`
# also tells the part which folder is the default one, where Claude Code
# runs with no variable set.
[agents.provider.permissions]
http = ["api.anthropic.com"]
env = ["CLAUDE_CONFIG_DIR", "DISABLE_AUTOUPDATER"]

# The global config file of the default profile sits next to `~/.claude`,
# outside its folder, so it is a plain key file of the part: it names the
# account of the Claude login, and its Console key comes as a handle.
[[agents.provider.permissions.keys]]
files = ["~/.claude.json"]
fields = ["/primaryApiKey"]

# The `/usage` probe: `claude` that can run nothing, with no tools, no MCP
# servers of the user, no hooks and no remote control. Each argument is a
# glob, so the braces of the settings are escaped.
[[agents.provider.permissions.terminal]]
program = "claude"
args = [
  "--allowed-tools",
  "",
  "--strict-mcp-config",
  "--settings",
  '\{"remoteControlAtStartup":false,"disableAllHooks":true\}',
]

# The Claude Code profiles whose logins the part reads to find its
# accounts. OTTY gives the part the folders of those profiles, wherever
# they are, when it asks for the accounts, and the folders of an account
# when it reads it; for that call only the part reads there what this
# entry lists: `read` as plain files, `keys` with the keys replaced by
# handles. The `/usage` probe may get `CLAUDE_CONFIG_DIR` set only to one
# of those folders.
#
# `log_in` offers Add account → "Log in with Claude Code": OTTY makes a
# folder of its own and runs `claude auth login --claudeai` there with
# `CLAUDE_CONFIG_DIR` set to it, in a terminal tab the user sees. The
# part reads that folder as a Claude Code profile folder of this entry.
# There the `/usage` probe also runs when the login token is past its
# time or Anthropic refused it, so Claude Code renews OTTY's own login
# itself; the part never renews a token.
#
# `read` is the session files of Claude Code: the part counts what the
# sessions of a profile folder spent this month through the key or the
# Console organization that pays for that folder, at API prices ("Your
# spend this month"), and the probe lists its own files there. The files
# of OTTY's own login folder are the probe's and are never counted.
#
# `write` is the session files of the probe and their folder, the only
# files the part may delete, inside each folder of the call.
[[agents.provider.logins]]
agent = "claude-code"
folder_env = "CLAUDE_CONFIG_DIR"
log_in = true
read = ["projects/*/**/*.jsonl"]
write = [
  "projects/*--cache-otty-agent-probe",
  "projects/*--cache-otty-agent-probe/*.jsonl",
]

# The Claude login: its token, and the refresh token Claude Code renews
# it with.
[[agents.provider.logins.keys]]
files = [".credentials.json"]
fields = ["/claudeAiOauth/accessToken", "/claudeAiOauth/refreshToken"]

# The global config file of a profile outside the default folder: the
# account of its Claude login and its Console key.
[[agents.provider.logins.keys]]
files = [".claude.json"]
fields = ["/primaryApiKey"]

# The variables the settings give Claude Code: a key, and the server it
# is sent to.
[[agents.provider.logins.keys]]
files = ["settings.json"]
fields = ["/env/ANTHROPIC_AUTH_TOKEN", "/env/ANTHROPIC_API_KEY"]
