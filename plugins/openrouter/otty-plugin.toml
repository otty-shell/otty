# The manifest of the official OpenRouter plugin: one provider part that
# reads the limit of an OpenRouter key and how much of it was used.
[plugin]
id = "openrouter"
name = "OpenRouter"
version = "0.1.7"
description = "OpenRouter keys in OTTY."
repository = "https://github.com/otty-shell/otty-plugin-openrouter"
license = "Apache-2.0"
authors = ["OTTY team"]
wasm = "openrouter.wasm"

[[agents.provider]]
id = "openrouter"
name = "OpenRouter"
description = "Reads the limit of OpenRouter keys and how much of it was used."
icon = "openrouter.svg"
hosts = ["openrouter.ai"]
usage_page = "https://openrouter.ai/activity"

# Apply only while a function of this part runs.
[agents.provider.permissions]
http = ["openrouter.ai"]
