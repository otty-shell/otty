[package]
name = "otty-plugin-openrouter"
description = "The official OpenRouter plugin of OTTY: the limit of an OpenRouter key and its use"
readme = "README.md"
version = "0.1.3"
license = "Apache-2.0"
publish = false
edition = "2024"
rust-version = "1.96.0"

# A plugin is its own cargo workspace, outside the OTTY build.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Inside the OTTY repository the official plugins use the SDK by path.
otty-plugin-sdk = { path = "../../crates/plugins/sdk" }
serde_json = "1.0.149"

# Plugins are built for speed, not size (spec Decision 2).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
