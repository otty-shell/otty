[package]
name = "otty-plugin-opencode"
description = "The official OpenCode plugin of OTTY: the OpenCode agent part"
readme = "README.md"
version = "0.1.2"
license = "Apache-2.0"
publish = false
edition = "2024"
rust-version = "1.96.0"

# A plugin is its own cargo workspace, outside the OTTY build.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Inside the OTTY repository the official plugins use the SDK by path.
otty-plugin-sdk = { path = "../../crates/plugins/sdk" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
# Writes the made-up OpenCode databases of the tests, as OpenCode writes
# its own; the version and features the SDK's test host reads them with.
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
# Makes the middle part of the made-up login tokens of the tests; the
# version the SDK's test host decodes them with.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }

# Plugins are built for speed, not size (spec Decision 2).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
