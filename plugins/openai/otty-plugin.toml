# The manifest of the official OpenAI plugin: the agent Codex and the
# provider OpenAI.
[plugin]
id = "openai"
name = "OpenAI"
version = "0.2.0"
description = "Codex profiles, logins, sessions, tokens and limits; ChatGPT limits and credits; OpenAI organization costs."
repository = "https://github.com/otty-shell/otty-plugin-openai"
license = "Apache-2.0"
authors = ["OTTY team"]
wasm = "openai.wasm"

# One contract version per kind of part the .wasm exports, and the
# language receiver: the texts of the needs come in every language of
# OTTY.
[api]
agent = "0.1"
provider = "0.1"
language = "0.1"

[[agent]]
id = "codex"
name = "Codex"
icon = "codex.svg"
program = "codex"
tested_version = "0.169.0"

# Apply only while a function of this part runs. `CODEX_HOME` moves the
# default config folder.
[agent.permissions]
read = ["~/.codex*/**", "{CODEX_HOME}/**"]
env = ["CODEX_HOME"]

[[agent.permissions.run]]
program = "codex"
args = ["--version"]

# Talked to line by line for the limits of the login; only `initialize`,
# `initialized` and `account/rateLimits/read` are ever sent.
[[agent.permissions.run]]
program = "codex"
args = ["-s", "read-only", "-a", "never", "app-server"]

# Where the keys are: readable only with the keys replaced by handles.
# The login of `codex login`, a ChatGPT login or an API key. The plugin
# reads whether a key is there and the claims of the tokens, never a key.
[[agent.permissions.keys]]
files = ["~/.codex*/auth.json", "{CODEX_HOME}/auth.json"]
fields = ["/OPENAI_API_KEY", "/tokens/access_token", "/tokens/id_token",
          "/tokens/refresh_token"]

# The numbers of OpenAI accounts: the limits and credits of a ChatGPT
# login (also one only OpenCode keeps) and the costs of an organization
# read with an admin key added by hand. A login behind a gateway is for
# the gateway's host and is not read here.
[[provider]]
id = "openai"
name = "OpenAI"
icon = "openai.svg"
hosts = ["openai.com", "chatgpt.com"]
usage_page = "https://platform.openai.com/usage"
plan_usage_page = "https://chatgpt.com/codex/settings/usage"
add_by_hand = true

# Apply only while a function of this part runs: the files of the `codex`
# part are refused then.
[provider.permissions]
http = ["chatgpt.com", "api.openai.com"]
