# The manifest of the official OpenAI plugin: the agent Codex and the
# provider OpenAI.
[plugin]
id = "openai"
name = "OpenAI"
version = "0.2.17"
description = "Codex, ChatGPT and OpenAI accounts in OTTY."
repository = "https://github.com/otty-shell/otty-plugin-openai"
license = "Apache-2.0"
authors = ["OTTY team"]
wasm = "openai.wasm"

[[agents.agent]]
id = "codex"
name = "Codex"
description = "Finds Codex profiles, sessions, tokens and their money."
icon = "codex.svg"
program = "codex"
tested_version = "0.169.0"

# Offered when OTTY finds the program nowhere: the install script of
# Codex, as its repository gives it, and that repository. It names no
# folder for the program, so the part has no program place.
[agents.agent.install]
command = ["sh", "-c", "curl -fsSL https://chatgpt.com/codex/install.sh | sh"]
page = "https://github.com/openai/codex"

# Apply only while a function of this part runs. `CODEX_HOME` moves the
# default config folder.
[agents.agent.permissions]
read = ["~/.codex*/**", "{CODEX_HOME}/**"]
env = ["CODEX_HOME"]

[[agents.agent.permissions.run]]
program = "codex"
args = ["--version"]

# Where the keys are: readable only with the keys replaced by handles.
# The login of `codex login`, a ChatGPT login or an API key. The agent
# part reads only whether a key or a token is there, to tell whether the
# profile can be used, never a key. Every token is declared, so none of
# them reaches the part as text.
[[agents.agent.permissions.keys]]
files = ["~/.codex*/auth.json", "{CODEX_HOME}/auth.json"]
fields = ["/OPENAI_API_KEY", "/tokens/access_token", "/tokens/id_token",
          "/tokens/refresh_token"]

# The accounts of OpenAI and their numbers. The part finds its accounts
# itself in the Codex profiles OTTY gives it (`logins` below): a ChatGPT
# login of `auth.json` is a subscription, known by its account id, and an
# API key is a key, known by its fingerprint. A login behind a gateway is
# for the gateway's host and is no OpenAI account. The numbers are the
# limits and credits of a ChatGPT login, read from `chatgpt.com` with its
# token, else what Codex knows of them in a folder the account was found
# in, and the costs of an organization read with the admin key the user
# gives for it.
[[agents.provider]]
id = "openai"
name = "OpenAI"
description = "Reads ChatGPT limits and credits, and OpenAI organization costs."
icon = "openai.svg"
hosts = ["openai.com", "chatgpt.com"]
usage_page = "https://platform.openai.com/usage"
plan_usage_page = "https://chatgpt.com/codex/settings/usage"

# Apply only while a function of this part runs. The files of the `codex`
# part are refused then, but for what `logins` below lists inside the
# folders of the call.
[agents.provider.permissions]
http = ["chatgpt.com", "api.openai.com"]

# Talked to line by line for the limits of a ChatGPT login, in a Codex
# profile folder the account was found in, which `CODEX_HOME` names (see
# `folder_env` below); only `initialize`, `initialized` and
# `account/rateLimits/read` are ever sent.
[[agents.provider.permissions.run]]
program = "codex"
args = ["-s", "read-only", "-a", "never", "app-server"]

# The Codex profiles whose logins the part reads to find its accounts.
# OTTY gives the part the folders of those profiles, wherever they are,
# when it asks for the accounts, and the folders of an account when it
# reads its numbers; for that call only the part reads there: the config,
# which tells whether a login is sent to a gateway, and the session files,
# where Codex writes the limits it was last told, as plain files, and
# `auth.json` with its keys replaced by handles. `codex app-server` gets
# `CODEX_HOME` set only to one of those folders.
#
# `log_in` offers Add account → "Log in with Codex": OTTY makes a folder
# of its own and runs `codex login` there with `CODEX_HOME` set to it, in
# a terminal tab the user sees. The part reads that folder as a Codex
# profile folder of this entry, but for its session files, and reads its
# limits with `codex app-server` there first, so Codex renews OTTY's own
# login itself; the part never renews a token.
[[agents.provider.logins]]
agent = "codex"
folder_env = "CODEX_HOME"
log_in = true
read = ["config.toml", "sessions/**", "archived_sessions/**"]

[[agents.provider.logins.keys]]
files = ["auth.json"]
fields = ["/OPENAI_API_KEY", "/tokens/access_token", "/tokens/id_token",
          "/tokens/refresh_token"]
