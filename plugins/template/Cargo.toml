[package]
name = "otty-plugin-example"
description = "The OTTY plugin template: a made-up agent and a made-up provider"
readme = "README.md"
version = "0.1.7"
license = "Apache-2.0"
publish = false
edition = "2024"
rust-version = "1.96.0"

# A plugin is its own cargo workspace, outside the OTTY build.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# A plugin of its own repository depends on a git tag of OTTY instead:
# otty-plugin-sdk = { git = "https://github.com/otty-shell/otty", tag = "v0.1.0" }
otty-plugin-sdk = { path = "../../crates/plugins/sdk" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Plugins are built for speed, not size (spec Decision 2).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
