# The manifest of the official DeepSeek plugin: one provider part that
# reads the money left on a DeepSeek account with its key.
[plugin]
id = "deepseek"
name = "DeepSeek"
version = "0.1.8"
description = "DeepSeek accounts in OTTY."
repository = "https://github.com/otty-shell/otty-plugin-deepseek"
license = "Apache-2.0"
authors = ["OTTY team"]
wasm = "deepseek.wasm"

[[agents.provider]]
id = "deepseek"
name = "DeepSeek"
description = "Reads the money left on DeepSeek accounts."
icon = "deepseek.svg"
hosts = ["deepseek.com"]
usage_page = "https://platform.deepseek.com/usage"

# Apply only while a function of this part runs.
[agents.provider.permissions]
http = ["api.deepseek.com"]
