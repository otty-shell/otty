name: Security Audit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  cargo-deny:
    permissions:
      checks: write
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust ${{ vars.RUST_STABLE_TOOLCHAIN }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ vars.RUST_STABLE_TOOLCHAIN }}
    - uses: EmbarkStudios/cargo-deny-action@v2
