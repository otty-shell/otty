name: Tests

on:
  pull_request:
  push:
    branches:
    - main

# A new push to a pull request cancels the older run of the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  rust_stable: "1.96"
  # Keep only line tables in debug info: faster build and link, smaller cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  Tests:
    name: ${{ matrix.os }} / rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.rust_stable }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_stable }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The terminal tests start real shells in parallel and need more open
      # files than the macOS default of 256.
      - run: |
          ulimit -n 4096
          cargo test --locked --all-features --verbose
      # The data types of otty-containers without its engine client, as the
      # feature crates use them.
      - run: cargo test --locked -p otty-containers --no-default-features --verbose
