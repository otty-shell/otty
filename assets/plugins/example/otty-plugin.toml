# The manifest of the template plugin: one agent part and one provider
# part of the `agents` domain, each with its own permissions. Both are
# made up.
[plugin]
id = "example"
name = "Example"
version = "0.1.0"
description = "A made-up agent and a made-up provider: the start of a new plugin."
repository = "https://github.com/otty-shell/otty-plugin-example"
license = "Apache-2.0"
authors = ["OTTY team"]
wasm = "example.wasm"

# One contract version per kind of part the .wasm exports, keyed by the
# domain and the part, and the language receiver, which belongs to no
# part and no domain: the texts of this plugin come in every language of
# OTTY.
[api]
agents.agent = "0.1"
agents.provider = "0.1"
language = "0.1"

[[agents.agent]]
id = "example-agent"
name = "Example Agent"
icon = "example-agent.svg"
program = "example-agent"
tested_version = "1.4.2"

# Apply only while a function of this part runs.
[agents.agent.permissions]
read = ["~/.example-agent*/**", "{EXAMPLE_AGENT_HOME}/**"]
env = ["EXAMPLE_AGENT_HOME"]

# Where the keys are: readable only with the keys replaced by handles.
[[agents.agent.permissions.keys]]
files = ["~/.example-agent*/auth.json", "{EXAMPLE_AGENT_HOME}/auth.json"]
fields = ["/api_key"]

[[agents.provider]]
id = "example-cloud"
name = "Example Cloud"
icon = "example-cloud.svg"
hosts = ["example.com"]
usage_page = "https://example.com/usage"
add_by_hand = true

[agents.provider.permissions]
http = ["api.example.com"]
