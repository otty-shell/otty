# The manifest of the official OpenAI plugin: the agent Codex and the
# provider OpenAI.
[plugin]
id = "openai"
name = "OpenAI"
version = "0.2.7"
description = "Codex, ChatGPT and OpenAI accounts in OTTY."
repository = "https://github.com/otty-shell/otty-plugin-openai"
license = "Apache-2.0"
authors = ["OTTY team"]
wasm = "openai.wasm"

# One contract version per kind of part the .wasm exports, and the
# language receiver: the texts of the needs come in every language of
# OTTY.
[api]
agents.agent = "0.1"
agents.provider = "0.1"
language = "0.1"

[[agents.agent]]
id = "codex"
name = "Codex"
description = "Finds Codex profiles, sessions, tokens and logins."
icon = "codex.svg"
program = "codex"
tested_version = "0.169.0"

# Offered when OTTY finds the program nowhere: the install script of
# Codex, as its repository gives it, and that repository. It names no
# folder for the program, so the part has no program place.
[agents.agent.install]
command = ["sh", "-c", "curl -fsSL https://chatgpt.com/codex/install.sh | sh"]
page = "https://github.com/openai/codex"

# Apply only while a function of this part runs. `CODEX_HOME` moves the
# default config folder.
[agents.agent.permissions]
read = ["~/.codex*/**", "{CODEX_HOME}/**"]
env = ["CODEX_HOME"]

[[agents.agent.permissions.run]]
program = "codex"
args = ["--version"]

# Where the keys are: readable only with the keys replaced by handles.
# The login of `codex login`, a ChatGPT login or an API key. The plugin
# reads whether a key is there and the claims of the tokens, never a key.
[[agents.agent.permissions.keys]]
files = ["~/.codex*/auth.json", "{CODEX_HOME}/auth.json"]
fields = ["/OPENAI_API_KEY", "/tokens/access_token", "/tokens/id_token",
          "/tokens/refresh_token"]

# The numbers of OpenAI accounts: the limits and credits of a ChatGPT
# login (also one only OpenCode keeps), else what Codex knows of them in a
# profile the login was found in, and the costs of an organization read
# with the admin key the user gives for it. A login behind a gateway is
# for the gateway's host and is not read here.
[[agents.provider]]
id = "openai"
name = "OpenAI"
description = "Reads ChatGPT limits and credits, and OpenAI organization costs."
icon = "openai.svg"
hosts = ["openai.com", "chatgpt.com"]
usage_page = "https://platform.openai.com/usage"
plan_usage_page = "https://chatgpt.com/codex/settings/usage"

# Apply only while a function of this part runs: the files of the `codex`
# part are refused then, but for the session files, where Codex writes the
# limits it was last told. `CODEX_HOME` moves the default config folder.
[agents.provider.permissions]
http = ["chatgpt.com", "api.openai.com"]
read = [
  "~/.codex*/sessions/**",
  "~/.codex*/archived_sessions/**",
  "{CODEX_HOME}/sessions/**",
  "{CODEX_HOME}/archived_sessions/**",
]
env = ["CODEX_HOME"]

# Talked to line by line for the limits of the login, in a Codex profile
# it was found in; only `initialize`, `initialized` and
# `account/rateLimits/read` are ever sent.
[[agents.provider.permissions.run]]
program = "codex"
args = ["-s", "read-only", "-a", "never", "app-server"]
