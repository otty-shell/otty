[workspace]
resolver = "3"
members = [
    "app",
    "crates/vte",
    "crates/escape",
    "crates/pty",
    "crates/surface",
    "crates/libterm",
    "crates/containers",
    "crates/ui/*",
    "crates/app/domain",
    "crates/app/i18n",
    "crates/app/shell",
    "crates/app/theme",
    "crates/app/slots",
    "crates/app/testing",
    "crates/app/features/notifications",
    "crates/app/features/explorer/core",
    "crates/app/features/explorer/io",
    "crates/app/features/palette",
    "crates/app/features/settings",
    "crates/app/features/tabs",
    "crates/app/features/terminal",
    "crates/app/features/quick-launch",
    "crates/app/features/containers",
    "crates/app/otty",
]

[workspace.package]
edition = "2024"
rust-version = "1.96.0"

[workspace.dependencies]
iced = "0.14"
thiserror = "2.0.18"
bitflags = "2.11.0"
log = "0.4.29"
anyhow = "1.0.102"
mio = "^1.1.1"
cursor-icon = { version = "1.2.0", default-features = false }
nix = { version = "0.31.2", features = ["term", "fs", "hostname"]}
signal-hook = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
